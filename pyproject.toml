[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "korrekturassistent"
version = "0.1.0"
description = "Lokaler Assistent für nachvollziehbare Korrekturvorschläge zu anonymisierten OCR-Klausuren"
requires-python = ">=3.11"
dependencies = ["PyMuPDF>=1.24,<2"]

[project.scripts]
korrekturassistent = "korrekturassistent.app:main"

[tool.setuptools.packages.find]
where = ["src"]

